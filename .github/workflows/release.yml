name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test
      - name: Build universal app
        run: scripts/bundle.sh --universal
      - name: Zip
        run: ditto -c -k --keepParent "build/GLM MCP.app" "GLM-MCP-${GITHUB_REF_NAME}.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "GLM-MCP-${GITHUB_REF_NAME}.zip" \
            --title "GLM MCP $GITHUB_REF_NAME" --generate-notes
